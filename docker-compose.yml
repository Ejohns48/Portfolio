version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: portfolio
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - portfolio-network

  # Backend API
  backend:
    build: ./server
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-changeme}@mongodb:27017/portfolio?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - portfolio-network

  # Frontend (optional - for full-stack deployment)
  # frontend:
  #   build: .
  #   container_name: portfolio-frontend
  #   restart: unless-stopped
  #   environment:
  #     REACT_APP_API_URL: http://localhost:5000/api
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - portfolio-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  portfolio-network:
    driver: bridge
